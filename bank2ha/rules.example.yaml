# Kategoriregler – regex matches mod modpart + posteringstekst (case-insensitive).
# Første regel der matcher vinder. Filen genindlæses automatisk når den ændres.
# direction: in (indbetalinger) | out (udbetalinger) | udelad = begge
default_in: Indtægt
default_out: Andet

rules:
  - category: Løn
    direction: in
    match: ["l[øo]n", "salary", "vibrantcolor"]

  - category: Dagligvarer
    direction: out
    match: ["netto", "f[øo]tex", "bilka", "rema", "lidl", "meny", "spar ", "coop", "kvickly", "superbrugsen", "dagli.?brugsen", "aldi"]

  - category: El & varme
